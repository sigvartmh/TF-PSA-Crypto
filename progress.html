# SPAKE2+ in TF-PSA-Crypto
### Progress so far

Four workstreams: upstreaming, per-issue PR split, hardware-accelerated design, and PAKE codegen analysis.

---

## What was done — overview

1. **Upstreaming prep** — review, deepened presentation, Matter-minimal toggle, PR-splitter.
2. **Executed the PR split** — 4 stacked, CI-passing PRs mapped to the Mbed-TLS issues.
3. **HW-accelerated SPAKE2+ design** — wired to SE Manager on HOST + SE firmware.
4. **PAKE driver-wrapper codegen** — investigation + design note.

All against `sisdk/TF-PSA-Crypto`, branch `spake2p-matter-wip`.

---

<!-- .slide: data-background-color="#002B49" class="dark divider" -->
# 1. Upstreaming prep

---

## Deliverables produced

- **`review.md`** — discrepancies (stale doc, scaffolding in history, horizontal-vs-vertical commits, dead P-384/P-521 tables) graded A/B/C with fixes + owning PR.
- **`Presentation.md` + `spake2p-presentation.html`** — Silicon Labs-branded reveal.js deck: SPAKE2+ math deep-dive (D1–D7), architecture (A1–A9), one slide per issue.
- **Matter-minimal toggle** — curve-gated the per-curve `M`/`N` tables in `spake2p.c`; verified default build + both suites pass.
- **`scripts/split_spake2p_prs.sh`** — re-cuts the history into per-issue, CI-gated branches.

## Key decisions & realities

- **Combined where co-developed:** CMAC (#9377) rides in PR-C (one engine commit); Matter + registration share PR-E. No artificial hunk-splitting.
- **#9343 folded into PR-C** — it is *not independently buildable*: its config-validation lives in the "wire up build configuration" commit (horizontal-commit problem).
- **Scaffolding stripped** (`CLAUDE.md`, `apply_commit.sh`, `commit/`) — absent from every PR branch.
- Committed **H1** (Matter/registration follow-up) + **H2** (docs/curve-gating/hygiene) with DCO sign-off; analysis artifacts kept untracked.

---

## How it was run

- **bash 5.2 via `pixi global install bash`** (script needs bash ≥ 4; the version guard re-execs into it).
- **CI gate:** the macOS host's nix-clang **ASan runtime hangs** in the leak detector + ctest overrides `ASAN_OPTIONS`, so the gate runs a **reliable normal build + the identical ctest suites**, with ASan as opt-in (`SPAKE2P_CI_ASAN=1`) for Linux/upstream.
- Stacked cherry-picks + the combine/cleanup steps validated in throwaway git worktrees.

> Caveat: local CI ran non-ASan; re-run upstream/Linux ASan before merging.

# 3. HW-accelerated SPAKE2+

---

## The finding

- SPAKE2+ in SiSDK is **software-only** today (`platform/sl_psa_driver` has no PAKE driver).
- The **SE firmware already has** P-256 SPAKE2+ EC primitives (`spake2p_p256_{reduce,check_key,get_key_share,get_ZV}`) — but they're **dormant**: no HOST mailbox command exposes them (unlike EC-JPAKE).
- EC-JPAKE (`se_jpake.c` + `SLI_SE_COMMAND_JPAKE_*`) is the exact pattern to mirror.

Delivered **`spake2_hw.md` + `spake2_hw.html`** — integration doc with 7 mermaid diagrams.

## Two architectures (recommend A)

- **Option A — EC-primitive offload (recommended):** HOST runs the protocol (M/N, transcript `TT`, HKDF, confirm MAC); SE does only the secret-scalar EC math via **4 new mailbox commands** wrapping the existing primitives. Reuses audited code, minimal SE FW work.
- **Option B — full SPAKE2+ in SE:** SE owns the whole protocol (like EC-JPAKE); best secret isolation, but substantial new SE firmware.

| Command | In | Out |
|---------|----|----|
| `SPAKE2P_KEY_SHARE` | `w0`,`xy`,`MN` | `XY[65]` |
| `SPAKE2P_ZV` | `w0`,`w1\|nil`,`xy`,`YX`,`NM`,`L\|nil` | `Z`,`V` |
| `SPAKE2P_CHECK_KEY` / `_REDUCE` | `K[65]` / `xs[]` | status / `x[32]` |

## Matter migration plan (full CryptoPAL)

Replace connectedhomeip's `Spake2p_P256_SHA256_HKDF_HMAC` backend with a PSA-PAKE one:

| Matter method | PSA PAKE |
|---------------|----------|
| Init / BeginProver / BeginVerifier | import `w0\|w1` / `w0\|L`; `psa_pake_setup(SPAKE2P_MATTER)` + role/user/peer/context |
| ComputeRoundOne | `output(KEY_SHARE)` + `input(KEY_SHARE)` |
| ComputeRoundTwo / KeyConfirm | `output(CONFIRM)` / `input(CONFIRM)` |
| GetKeys | `get_shared_key` → `Ke` |

It then inherits the SE acceleration for free.

The reusable `OS-template-*.jinja` only handle one-shot dispatch; PAKE is stateful, so its five wrappers are hardcoded.

---

## The targeted design

- A `pake` **JSON capability** (schema already allows free-form `entry_points`).
- Two new jinja templates: a **setup-selector** (records `operation->id`) + an **id-dispatch** for the other four entry points.
- Operation-context union stays hand-defined (one member, like the test driver).
- **No-diff conversion proof:** regenerate with test+builtin only → `git diff` shows zero change; then real drivers are **JSON-only**.

**Payoff:** the SE SPAKE2+ driver (and J-PAKE) added by dropping a JSON file — no template edit. Delivered **`pake-driver-codegen.md`** + updated the two caveats.
